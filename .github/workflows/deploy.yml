# GitHub Pages 自动部署工作流
#
# 流程：git push → npm ci → lint → test → build → 发布 GitHub Pages
#
# ## 回滚到历史版本
# Actions → Deploy GitHub Pages → Run workflow → ref 填上一个正常发布的提交 SHA
# （或标签），再运行。Pages 会重新发布那一版的产物，无需改代码、无需 revert 提交。
#
# ## 已知取舍
# - `npm audit` 刻意不阻塞发布（与 cycling-analyzer 同口径）：新披露的传递依赖漏洞
#   不应让一次与它无关的提交无法上线。它仍然每次运行并打印结论。
# - e2e 暂未接入（v1 无路由深链、核心链路已有 jsdom 单测覆盖），待办见 docs/PROGRESS.md
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: '要部署的提交/标签（留空 = 当前分支头）。回滚时填上一个正常发布的提交 SHA'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Audit dependencies (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
